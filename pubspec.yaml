name: phosphor_flutter
description: >
  Vendored phosphoricons for Flutter (2.1.0) patched for Flutter 3.44+ where
  IconData is final — uses extension types + duotone secondary map. Upstream:
  https://github.com/phosphor-icons/phosphor-flutter
version: 2.1.0+feeef.1
publish_to: "none"
homepage: https://phosphoricons.com/
repository: https://github.com/phosphor-icons/phosphor-flutter

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: PhosphorBold
      fonts:
        - asset: lib/fonts/Phosphor-Bold.ttf
          weight: 400
    - family: PhosphorDuotone
      fonts:
        - asset: lib/fonts/Phosphor-Duotone.ttf
          weight: 400
    - family: PhosphorFill
      fonts:
        - asset: lib/fonts/Phosphor-Fill.ttf
          weight: 400
    - family: PhosphorLight
      fonts:
        - asset: lib/fonts/Phosphor-Light.ttf
          weight: 400
    - family: PhosphorThin
      fonts:
        - asset: lib/fonts/Phosphor-Thin.ttf
          weight: 400
    - family: PhosphorRegular
      fonts:
        - asset: lib/fonts/Phosphor.ttf
          weight: 400
